<mat-toolbar class="toolbar mat-elevation-z4">
  <span>{{nombreComponente}}</span>
  <div class="example-spacer"></div>
</mat-toolbar>
<div>
  <p></p>
  <form [formGroup]="form" (ngSubmit)="onCreate()">
    <mat-grid-list cols="2">
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" id="nombre" type="text" name="nombre" placeholder="Nombre" autocomplete="given-name" />
      </mat-form-field>
      <p></p>
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Apellido</mat-label>
        <input matInput type="text" formControlName="apellido" id="apellido" name="apellido" placeholder="Apellido" autocomplete="family-name"/>
      </mat-form-field>
      <p></p>
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Celular</mat-label>
        <input matInput formControlName="celular" type="number" id="celular" name="celular" placeholder="Celular" autocomplete="tel"/>
      </mat-form-field>
      <p></p>
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" id="email" name="email" placeholder="Email" autocomplete="email"/>
        <mat-error *ngIf="form.controls['email'].invalid">{{ getErrorMessage() }}</mat-error>
      </mat-form-field>
      <p></p>
      <mat-form-field appearance="legacy" class="ancho">
        <mat-label>Provincia</mat-label>
        <input type="text" matInput placeholder="Buscar provincia..." [formControl]="filtroProvincia" [matAutocomplete]="autoProvincia" autocomplete="off">
        <mat-autocomplete #autoProvincia="matAutocomplete" (optionSelected)="onProvinciaSeleccionada($event.option.value)">
          <mat-option *ngFor="let prov of provinciaFiltradas" [value]="prov.nombre">
            {{ prov.nombre }}
          </mat-option>
        </mat-autocomplete>
        <mat-error *ngIf="form.controls['provincia'].invalid && form.controls['provincia'].touched">
          Seleccione una provincia válida
        </mat-error>
      </mat-form-field>
      <p></p>
      <mat-form-field appearance="legacy" class="ancho">
        <mat-label>Localidad</mat-label>
        <input type="text" matInput placeholder="Buscar localidad..." [formControl]="filtroLocalidad" [matAutocomplete]="autoLocalidad" autocomplete="off">
        <mat-autocomplete #autoLocalidad="matAutocomplete" (optionSelected)="onLocalidadSeleccionada($event.option.value)">
          <mat-option *ngFor="let loc of localidadesFiltradas" [value]="loc.nombre">
            {{ loc.nombre }}
          </mat-option>
        </mat-autocomplete>
        <mat-error *ngIf="form.controls['localidad'].invalid && form.controls['localidad'].touched">
          Seleccione una localidad válida
        </mat-error>
      </mat-form-field>
    </mat-grid-list>
    <div mat-dialog-actions [align]="'end'">
      <button mat-raised-button color="warn" mat-dialog-close>Cerrar</button>
      <button type="submit" mat-raised-button color="primary">Guardar</button>
    </div>
  </form>
</div>
