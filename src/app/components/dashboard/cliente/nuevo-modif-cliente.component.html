<mat-toolbar class="toolbar mat-elevation-z4">
  <span>{{nombreComponente}}</span>
  <div class="example-spacer"></div>
</mat-toolbar>
<div>
  <p></p>
  <form [formGroup]="form" (ngSubmit)="onCreate()">
    <mat-grid-list cols="2">
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" type="text" name="nombre" placeholder="Nombre" autocomplete="off" />
      </mat-form-field>
      <p></p>
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Apellido</mat-label>
        <input matInput type="text" formControlName="apellido" name="apellido" placeholder="Apellido" autocomplete="off"/>
      </mat-form-field>
      <p></p>
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Celular</mat-label>
        <input matInput formControlName="celular" type="number" name="celular" placeholder="Celular" autocomplete="off"/>
      </mat-form-field>
      <p></p>
      <mat-form-field class="ancho" appearance="legacy">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" name="email" placeholder="Email" autocomplete="off"/>
        <mat-error *ngIf="email.invalid">{{getErrorMessage()}}</mat-error>
      </mat-form-field>
      <p></p>
      <mat-form-field appearance="legacy" class="ancho">
        <mat-label>Provincia</mat-label>
        <mat-select formControlName="provincia" name="provincia" id="provincia" placeholder="Seleccione una Provincia" (selectionChange)="cargarLocalidadPorProvinciaId($event)">
          <mat-option *ngFor="let provincia of provincias" [value]="provincia.id_provincia">
            {{provincia.nombre}}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <p></p>
      <mat-form-field appearance="legacy" class="ancho">
        <mat-label>Localidad</mat-label>
        <mat-select formControlName="localidad" name="localidad" id="localidad" placeholder="Seleccione una Localidad">
          <mat-option *ngFor="let localidad of localidades" [value]="localidad">
            {{localidad.nombre}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </mat-grid-list>
    <div mat-dialog-actions [align]="'end'">
      <button mat-raised-button color="warn" style="margin-left: 8px; height: 50px;" mat-dialog-close>Cerrar</button>
      <button type="submit" style="margin-left: 8px; height: 50px;" mat-raised-button color="primary" >Guardar</button>
    </div>
  </form>
</div>
